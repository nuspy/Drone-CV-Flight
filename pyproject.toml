[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronecv"
version = "0.1.0"
description = "GPS-denied autonomous drone visual navigation: Unity/headless-sim training, redundant visual localization, guidance and automated reliability testing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pymap3d>=3.1",
    "jinja2>=3.1",
    "torch>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
gis = [
    "shapely>=2.0",
    "rasterio>=1.3",
    "httpx>=0.27",
    "pyproj>=3.6",
    "mapbox_earcut>=1.0",
    "pillow>=10.0",
    # Overture Maps reads GeoParquet on S3 via fsspec+pyarrow; fsspec's
    # HTTPFileSystem needs aiohttp+requests (else: "HTTPFileSystem requires
    # requests and aiohttp to be installed").
    "fsspec>=2024.0",
    "pyarrow>=16.0",
    "aiohttp>=3.9",
    "requests>=2.31",
]
gui = ["PySide6>=6.7"]

[project.scripts]
dronecv = "dronecv.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "e2e: full end-to-end pipeline tests (slow)",
    "integration: multi-module tests (medium)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
