[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "decipher"
version = "0.1.0"
description = "Falsification-first toolkit for structuring and cautiously decoding unknown scripts"
requires-python = ">=3.10"
dependencies = []   # core pipeline is dependency-free; vision/embedding/LLM extras added per-module

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["decipher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
